services:
  db:
    image: postgres:latest
    container_name: passwordbreaker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: passwordbreaker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: .
      dockerfile: PasswordBreaker.Frontend/Dockerfile
    container_name: passwordbreaker-frontend
    ports:
      - "5173:80"

volumes:
  postgres_data:
